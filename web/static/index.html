<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mercury</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Mercury</h1>
    <div class="controls">
      <span class="tick">Tick <b id="tick">0</b></span>
      <button id="step1" title="Advance one tick">Step</button>
      <button id="step10">+10</button>
      <button id="step100">+100</button>
      <button id="play" class="primary">Play</button>
      <label>Speed <select id="speed">
        <option value="1">1×</option><option value="5" selected>5×</option>
        <option value="20">20×</option><option value="100">100×</option>
      </select></label>
      <span class="sep"></span>
      <label>Transport cost <input id="cost" type="text" value="1" size="4"></label>
      <button id="reset" title="Rebuild the world with this transport cost (inf = no trade)">Reset</button>
    </div>
  </header>
  <main>
    <section class="map-pane">
      <div class="overlay-bar">
        <label>Overlay <select id="overlay">
          <option value="terrain">Terrain</option>
          <option value="utility">Utility per person</option>
          <option value="wage">Wage</option>
          <option value="price" selected>Price ÷ wage</option>
          <option value="basic">Basic share of spending</option>
          <option value="luxury">Luxury share of spending</option>
        </select></label>
        <label id="good-wrap">Good <select id="good"></select></label>
        <label><input id="show-flows" type="checkbox" checked> Trade flows</label>
        <label id="flow-good-wrap">of <select id="flow-good"></select></label>
      </div>
      <div class="canvas-wrap"><canvas id="map"></canvas><div id="tooltip" hidden></div></div>
      <div id="legend"></div>
    </section>
    <aside id="panel">
      <p class="hint">Click a tile to inspect it.</p>
    </aside>
  </main>
  <script src="app.js"></script>
</body>
</html>

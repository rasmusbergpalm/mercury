<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3a2618">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IM+Fell+English+SC&display=swap">
  <title>Mercury</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- lobby -->
  <section id="lobby" hidden>
    <header class="bar">
      <h1>Mercury</h1>
      <span class="sub">Build a nation, 1820–1920: balance commerce, science and arms on a map where every mile of carriage costs.</span>
      <a class="sub explainer" href="economy.html">How the economy works</a>
      <a class="sub explainer" href="transport.html">Carriage or Ice</a>
      <div class="menu"><button class="theme" title="Day or night">◐</button></div>
    </header>
    <main class="lobby">
      <section class="card">
        <h2>Games</h2>
        <div id="games"></div>
      </section>
      <section class="card">
        <h2>New game</h2>
        <form id="new-game" class="row">
          <label>Name <input id="new-name" maxlength="40" value="New game" required></label>
          <label>Transport cost <input id="new-cost" type="number" min="0" step="0.25" value="1" class="num"></label>
          <label>Pace <select id="new-turn">
            <option value="0">Real time</option>
            <option value="7">Turns of a week</option>
            <option value="30">Turns of a month</option>
            <option value="90">Turns of a season</option>
            <option value="365">Turns of a year</option>
          </select></label>
          <label>Map <select id="new-map">
            <option value="classic">Classic (36 tiles, 3 nations)</option>
            <option value="small">Small, generated (about 40 tiles)</option>
            <option value="medium">Medium (about 140 tiles)</option>
            <option value="large">Large (about 380 tiles)</option>
            <option value="huge">Huge (about 1,000 tiles)</option>
            <option value="world">The world in 1820 (2,021 tiles, 12 nations)</option>
          </select></label>
          <label>Nations <input id="new-nations" type="number" min="1" max="12" step="1" placeholder="auto" class="num"></label>
          <label class="check" title="Every tile starts owned: the nations share out the whole map, and grow only by war"><input id="new-divided" type="checkbox"> No free land</label>
          <button class="primary" type="submit">Create</button>
        </form>
      </section>
      <section class="card">
        <h2>Saved games</h2>
        <div id="saves"></div>
        <div class="row">
          <label class="file">Import a save file <input id="import" type="file" accept=".json,application/json"></label>
        </div>
      </section>
      <p id="lobby-err" class="err"></p>
    </main>
  </section>

  <!-- game -->
  <section id="game" hidden>
    <header class="bar">
      <button id="to-lobby" title="Back to the lobby">‹ Games</button>
      <h1 id="game-name">Mercury</h1>
      <span class="tick"><b id="date">1 January 1820</b></span>
      <div class="clock" id="clock">
        <button id="play" class="primary">Play</button>
        <select id="speed" aria-label="Speed"></select>
        <button id="step10" title="Advance 10 days">+10 days</button>
      </div>
      <div class="clock" id="turn" hidden>
        <button id="end-turn" class="primary">End turn</button>
        <span id="turn-status" class="sub"></span>
      </div>
      <div class="menu">
        <button id="save">Save</button>
        <a id="export" class="button" download>Export</a>
        <button id="leave" hidden>Leave</button>
        <button class="theme" title="Day or night">◐</button>
      </div>
    </header>
    <div id="you" class="you" hidden></div>
    <p id="game-err" class="err"></p>
    <main class="game">
      <section class="map-pane">
        <div class="overlay-bar">
          <select id="overlay" aria-label="Map overlay">
            <option value="nation">Nations</option>
            <option value="terrain">Terrain</option>
            <option value="growth">Population growth</option>
            <option value="infra">Infrastructure</option>
            <option value="population">Population</option>
            <option value="utility">Utility per person</option>
            <option value="wage">Wage</option>
            <option value="price">Price ÷ wage</option>
            <option value="basic">Basic share of spending</option>
            <option value="luxury">Luxury share of spending</option>
          </select>
          <select id="good" aria-label="Good" hidden></select>
          <label class="check"><input id="show-flows" type="checkbox"> Trade</label>
          <select id="flow-good" aria-label="Trade of" hidden></select>
          <span id="zoom" class="zoom" hidden><button data-zoom="out" title="Zoom out" aria-label="Zoom out">−</button><button data-zoom="in" title="Zoom in" aria-label="Zoom in">+</button></span>
        </div>
        <div class="canvas-wrap"><canvas id="map"></canvas><div id="tooltip" hidden></div><div id="mode" class="mode" hidden></div></div>
        <div id="legend"></div>
      </section>
      <aside class="side">
        <nav class="tabs" role="tablist">
          <button data-tab="tile" class="active">Tile</button>
          <button data-tab="nation">Nation</button>
          <button data-tab="state">State</button>
          <button data-tab="research">Research</button>
          <button data-tab="trade">Trade</button>
          <button data-tab="armies">Armies</button>
          <button data-tab="world">World</button>
        </nav>
        <div id="tab-tile" class="tab"><p class="hint">Tap a tile on the map.</p></div>
        <div id="tab-nation" class="tab" hidden></div>
        <div id="tab-state" class="tab" hidden></div>
        <div id="tab-research" class="tab" hidden></div>
        <div id="tab-trade" class="tab" hidden></div>
        <div id="tab-armies" class="tab" hidden></div>
        <div id="tab-world" class="tab" hidden></div>
      </aside>
    </main>
  </section>
  <div id="dialog" class="dialog" hidden><div class="dialog-card" role="dialog" aria-modal="true" aria-labelledby="dialog-title"></div></div>
  <script src="app.js"></script>
</body>
</html>

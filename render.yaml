# Render blueprint: https://render.com/docs/blueprint-spec
# Root directory: the repository root (leave "Root Directory" empty).
services:
  - type: web
    name: mercury
    runtime: go
    plan: free
    buildCommand: go build -trimpath -ldflags="-s -w" -o mercury ./cmd/server
    startCommand: ./mercury
    healthCheckPath: /api/games
    # The server autosaves every game every 30 game days (and resumes them
    # on start) under MERCURY_DATA, but Render wipes local disk on every
    # deploy and restart (and the free plan sleeps when idle). To keep games
    # and saves, use a paid plan with a disk and point MERCURY_DATA at it:
    # disk:
    #   name: saves
    #   mountPath: /var/data
    #   sizeGB: 1
    # envVars:
    #   - key: MERCURY_DATA
    #     value: /var/data/saves

# Publishes the economy page (web/static/economy.html, built by
# tools/explainer/build.sh) as the repository's GitHub Pages site.
# Turn it on once: Settings → Pages → Build and deployment → Source:
# GitHub Actions. (Pages needs a public repository, or a paid plan.)
name: Economy page

on:
  push:
    branches: [main]
    paths: [web/static/economy.html, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Built and deployed in two jobs, as GitHub's own Pages workflow does: the
  # deploy job starts only once the build job has finished uploading, so it
  # never looks for the site before the upload is visible (in one job it
  # sometimes found nothing).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir _site
          # on the site, the masthead links to the repository rather than the game's lobby
          sed 's#<a href="./" class="back">#<a href="https://github.com/${{ github.repository }}" class="back">#' \
            web/static/economy.html > _site/index.html
          grep -q 'href="https://github.com/' _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
